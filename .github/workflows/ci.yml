name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Enforces AGENTS.md § Branch naming, which was prose only until a bug fix
  # shipped on a `feature/` branch and nothing objected. Skipped for forks: a
  # contributor's branch name is not ours to police.
  branch:
    name: Branch naming
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the checker
        run: scripts/check-branch-name.sh --self-test
      - name: Check the branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Conventional-commit type of every commit the PR adds, deduplicated.
          types=$(git log --format=%s "$BASE_SHA..$HEAD_SHA" \
            | sed -nE 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p' | sort -u | tr '\n' ' ')
          echo "branch: $HEAD_REF"
          echo "commit types: ${types:-<none>}"
          scripts/check-branch-name.sh "$HEAD_REF" $types

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --all-targets
      - name: Run tests
        run: cargo test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus (Linux keyring backend)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: rustfmt
        run: cargo fmt --check
      # The tree is warning-free as of #50, so warnings fail the build from here
      # on. Without this the last pile grew back: 42 warnings on the `e2e` target
      # were enough noise that a real one in new code went unread.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
