name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Enforces AGENTS.md § Branch naming, which was prose only until a bug fix
  # shipped on a `feature/` branch and nothing objected. Skipped for forks: a
  # contributor's branch name is not ours to police.
  branch:
    name: Branch naming
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the checker
        run: scripts/check-branch-name.sh --self-test
      - name: Check the branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Conventional-commit type of every commit the PR adds, deduplicated.
          types=$(git log --format=%s "$BASE_SHA..$HEAD_SHA" \
            | sed -nE 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p' | sort -u | tr '\n' ' ')
          echo "branch: $HEAD_REF"
          echo "commit types: ${types:-<none>}"
          scripts/check-branch-name.sh "$HEAD_REF" $types

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus (Linux keyring backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # The oracle tests run a real sshd on loopback and feed `map --dot` to
      # Graphviz. With CI set they fail when either tool is missing instead of
      # skipping silently.
      - name: Install sshd and Graphviz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y openssh-server graphviz
      - name: Install Graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz
      - name: Build
        run: cargo build --all-targets
      - name: Run tests
        run: cargo test

  # The maintainer does not use Nix, so this job is what keeps flake.nix from
  # rotting: it builds the package and runs the result, the same smoke the
  # release workflow runs on its binaries. It also fills the sshub.cachix.org
  # binary cache that flake.nix points users at, so `nix run` substitutes the
  # build instead of compiling it. Fork PRs get no secrets: they only pull from
  # the cache and skip the push.
  nix:
    name: Nix build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    # The secret is only tested here, not exposed: the token itself is set on
    # the push step alone, and `secrets` cannot be read in a step `if`.
    env:
      HAS_CACHIX_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
      # PRs build the branch tip, not GitHub's merge commit, so testers running
      # `nix run github:Petyok/SSHub/<branch>` substitute what CI pushed (the
      # Test jobs still test the merge result).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: sshub
          skipPush: true
      - name: Build
        run: nix build -L
      - name: Smoke
        run: ./result/bin/sshub --dry-run
      # Only the package's runtime closure is what users substitute, so push
      # that, not every crate tarball and the vendor dir the build consumed.
      # Paths already on cache.nixos.org are skipped by cachix.
      - name: Push to the binary cache
        if: env.HAS_CACHIX_TOKEN == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push sshub ./result

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus (Linux keyring backend)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: rustfmt
        run: cargo fmt --check
      # The tree is warning-free as of #50, so warnings fail the build from here
      # on. Without this the last pile grew back: 42 warnings on the `e2e` target
      # were enough noise that a real one in new code went unread.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
