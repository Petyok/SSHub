[package]
name = "poc-crypto-interop"
version = "0.1.0"
edition = "2021"
description = "PoC A (host-sync crypto interop): Rust half of the Rust↔JS vector rig. Standalone crate, NOT a workspace member."
license = "AGPL-3.0-or-later"

[[bin]]
name = "emit-vectors"
path = "src/bin/emit-vectors.rs"

[[bin]]
name = "verify-js-blobs"
path = "src/bin/verify-js-blobs.rs"

[lib]
name = "poc_crypto_interop"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
bip39 = "2"
blake3 = "1"
chacha20poly1305 = "0.10"
bincode = { version = "2", features = ["serde"] }
crypto_box = { version = "0.9", features = ["std", "chacha20"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
ml-kem = { version = "0.2", features = ["deterministic"] }
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
