[package]
name = "poc-reshare"
version = "0.1.0"
edition = "2021"
description = "PoC B: resharing, the cost of revocation and forward secrecy of wrapped shares. Standalone crate, not a workspace member."
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sshub = { path = "../..", default-features = false }

[workspace]
