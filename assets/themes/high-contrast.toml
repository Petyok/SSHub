# SSHub — "High Contrast": maximum readability.
#
# This theme exists to prove that every gradient is optional. It defines none,
# and it does not reference any: a theme is complete with nothing but the
# semantic core.
#
# Foreground/background pairs are chosen for contrast rather than for mood, and
# the status colours are the six most distinguishable hues rather than tints of
# one another.

schema_version = 1
extends = "default"
name = "High Contrast"
description = "Pure black on white with saturated status colours and no decorative gradients."

[semantic]
background = "#000000"
canvas = "#000000"
surface = "#000000"
# The only surface that is not black, so raised chrome (header, footer, status
# bar) still separates from the panels without a border.
surface_raised = "#1a1a1a"

# Borders are bright enough to be seen, and focus is unmistakable.
border = "#8c8c8c"
border_focus = "#00ffff"
border_popup = "#ffffff"

text = "#ffffff"
text_bright = "#ffffff"
text_highlight = "#ffffff"
# "muted" and "dim" still have to clear a normal contrast bar here, so they are
# far lighter than in the other themes.
text_muted = "#c8c8c8"
text_dim = "#9a9a9a"
text_inverse = "#000000"

accent = "#ffff00"
selection_bg = "#0000aa"
selection_fg = "#ffffff"

success = "#00ff00"
warning = "#ffff00"
error = "#ff4040"
info = "#00ffff"
connecting = "#ff00ff"
exited = "#ff4040"
unknown = "#9a9a9a"
