[package]
name = "sshub-sync-proto"
version = "0.20.0"
edition = "2021"
description = "SSHub host sync protocol core: crypto, op-log types, wire frames and media decoders (pure Rust, no I/O)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Petyok/SSHub"
homepage = "https://sshub.petruha.uk"
readme = "README.md"
keywords = ["ssh", "sync", "crypto"]
categories = ["cryptography"]

[features]
default = []
# Reverse-QR decoder (a quirc port): raw grayscale in, payload bytes out.
qr-decode = ["dep:quircs"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2"
blake3 = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
ml-kem = { version = "=0.2.3", features = ["deterministic"] }
quircs = { version = "0.10", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
rand_chacha = "0.3"
