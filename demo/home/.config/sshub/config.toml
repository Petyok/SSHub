# Settings for the demo recordings. demo/record.py copies this directory into a
# fresh config dir for every scenario; demo/play.sh uses it in place.
#
# No [keybinds] table on purpose: the GIFs must show the default keys, and a
# stored table freezes whatever the defaults were when it was written.

[appearance]
show_detail_panel = true
date_format = "%Y-%m-%d %H:%M"
# Motion stays on: the slides are what the recordings exist to show.
disable_animation = false
confirm_quit = true
os_logo = true

[updates]
# No GitHub request while recording, and no update badge in frame.
check = false
